{% extends 'invoices/base.html' %}
{% block title %}Add Client - EasyBill{% endblock %}

{% block content %}
<div class="card" style="max-width:450px;">
    <h2>Add a Client</h2>
    <form method="POST">
        {% csrf_token %}
        <label>Client Name</label>
        <input type="text" name="name" required placeholder="e.g. Acme Corp">

        <label>Client Email</label>
        <input type="email" name="email" required placeholder="e.g. acme@email.com">

        <button type="submit" class="btn">Save Client</button>
    </form>
</div>
{% endblock %}
